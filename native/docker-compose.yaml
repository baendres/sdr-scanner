name: sdr-scanner-native

services:
  sdr_scanner_native:
    build: .
    ports:
      - "8080:8080"   # web UI + REST/WS control API
      - "8123:8123"   # websocket audio output (see example-sdrscan.yaml -> outputs)
    privileged: true
    volumes:
      - ./data:/data
      - ./volk:/root/.volk   # persists `docker exec <container> volk_profile`'s tuned kernel
                              # selection across rebuilds - see native/README.md
      - /dev/bus/usb:/dev/bus/usb
    # on-failure (not unless-stopped/always): restarts when the process exits non-zero - which
    # covers both a genuine crash and the settings page's "Restart Now" button (see main.cpp's
    # kRestartRequestedExitCode) - but does NOT auto-start this container just because the host
    # rebooted. That's deliberate if you're running this alongside another project's containers
    # on the same machine and want a reboot to bring *that* project back, not this one - see
    # native/README.md.
    restart: on-failure
