name: native CI

on:
  push:
    paths:
      - "native/**"
      - ".github/workflows/native-ci.yml"
  pull_request:
    paths:
      - "native/**"
      - ".github/workflows/native-ci.yml"

jobs:
  build-and-test:
    # Matches native/Dockerfile's base image so the same apt package names/versions apply -
    # Ubuntu 24.04 ships a recent-enough gnuradio-dev with the C++ headers/libs this needs, no
    # from-source GNU Radio build required (see native/README.md).
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake pkg-config \
            gnuradio-dev \
            libvolk-bin \
            libboost-dev libboost-system-dev \
            libsqlite3-dev \
            nlohmann-json3-dev \
            portaudio19-dev \
            libsoapysdr-dev soapysdr-module-all soapysdr-module-rtlsdr \
            rtl-sdr librtlsdr-dev \
            libyaml-cpp-dev \
            libmp3lame-dev \
            catch2 \
            ca-certificates \
            git

      # mbelib + DSDcc aren't packaged in Ubuntu 24.04's apt repo - native/CMakeLists.txt
      # pkg_check_modules(libdsdcc)'s for them, so they need to be built from source here too,
      # matching native/Dockerfile's build stage exactly (see that file's comment for why).
      - name: Build mbelib + DSDcc
        run: |
          git clone --depth 1 https://github.com/f4exb/mbelib.git /tmp/mbelib
          cmake -S /tmp/mbelib -B /tmp/mbelib/build -DCMAKE_BUILD_TYPE=Release -DDISABLE_TEST=ON
          cmake --build /tmp/mbelib/build -j"$(nproc)"
          sudo cmake --install /tmp/mbelib/build
          git clone --depth 1 https://github.com/f4exb/dsdcc.git /tmp/dsdcc
          patch -p1 -d /tmp/dsdcc < native/dsdcc-diagnostics.patch
          cmake -S /tmp/dsdcc -B /tmp/dsdcc/build -DCMAKE_BUILD_TYPE=Release -DUSE_MBELIB=ON -DBUILD_TOOL=OFF
          cmake --build /tmp/dsdcc/build -j"$(nproc)"
          sudo cmake --install /tmp/dsdcc/build
          sudo ldconfig

      - name: Configure
        working-directory: native
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release .

      - name: Build
        working-directory: native
        run: cmake --build build -j"$(nproc)"

      - name: Test
        working-directory: native/build
        # No SDR hardware in CI - the suite is written for that (see native/README.md's
        # "Testing without SDR hardware" section), so this covers the full 50+ tests as-is.
        run: ctest --output-on-failure
